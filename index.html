<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLeague Dashboard</title>
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #E1E8E9;
      gap:10px
    }

    .cards {
      display: flex;
      justify-content: space-evenly;
    }

    .heroBanner {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: linear-gradient(to right, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.5) 100%), url('assets/sport.jpg');
      color: white;
      padding: 20px;
    }

    .heroBanner button {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="search-bar" style="display: flex;justify-content: space-around ;align-items: center;padding: 20px;">
    <form
      style="display:flex;align-items: center ;background-color: rgb(226, 228, 230); padding: 10px; border-radius: 20px; gap:5px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" placeholder="Search for challenges, paticipants. . ."
        style="width: 300px; overflow: hidden; outline:none;border:none;">
    </form>
    <div style="display:flex;align-items: center;">

      <p><i class="fa-regular fa-bell"></i> Notifications</p>
    </div>
  </div>
  <div class="heroBanner">
    <p>Welcome back</p>
    <h1>FitLeague</h1>
    <p>Challenge your friends. Track your progress. Be the best!</p>
    <button><i class="fa-solid fa-plus"></i> Create a new challenge</button>
  </div>
  <div class="cards">
    <section class="card" style="max-width: 320px; width: 100%; background-color: #E2FBF1;">
      <div class="card-body">
        <i class="fa-solid fa-trophy"></i>
        <h4 class="card-title" style="font-weight: bold;">3</h4>
        <p class="card-text">Active Challenges</p>
      </div>
    </section>
    <section class="card" style="max-width: 320px; width: 100%; background-color: #EAF2FF;">
      <div class="card-body">
        <i class="fa-solid fa-people-group"></i>
        <h4 class="card-title" style="font-weight: bold;">5</h4>
        <p class="card-text">Participants</p>
      </div>
    </section>
    <section class="card" style="max-width: 320px; width: 100%; background-color: #F1EBFF;">
      <div class="card-body">
        <i class="fa-solid fa-chart-column"></i>
        <h4 class="card-title" style="font-weight: bold;">12</h4>
        <p class="card-text">Total results</p>
      </div>
    </section>
  </div>
</body>

</html>
