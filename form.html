<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM PAGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        
        * {
            margin: 1rem;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #F5F7FA;
            box-sizing: border-box;
        }

        h1 {
            font-weight: bold;
        }

        p {
            color: #8591A0
        }

        form {
            background-color: white;
        }

        .format {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            grid-template-areas:
                "challenges challenges"
                "description description"
                "type        metric"
                "goal        goal"
                "start       end"
        }

        .challenges {
            grid-area: challenges;
        }

        .description {
            grid-area: description;
        }

        .type {
            grid-area: type;
        }

        .metric {
            grid-area: metric;
        }

        .goal {
            grid-area: goal;
        }

        .start {
            grid-area: start;
        }

        .end {
            grid-area: end;
        }

        .resetBtn {
            border: none;
            border-radius: 10px;
            text-decoration: none;
            padding: 16px;
        }

        .submitBtn {
            background-color: #00865B;
            border: solid #E9EEF3 1px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            padding: 16px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <section>
        <p>Challenges / Create challenge</p>
        <h1>Create a new challenge</h1>
        <p>Set a goal. Get moving. Achieve more together.</p>
    </section>
    <form action="">
        <div class="format">
            <div class="challenges">
                <label for="exampleFormControlInput" class="form-label mb-2">Challenge title</label>
                <input type="text" class="form-control" id="exampleFormControlInput"
                    placeholder="e.g. 30-Day Running Challenge">
            </div>
            <div class="description">
                <label for="exampleFormControlTextarea2" class="form-label">Description </label>
                <textarea class="form-control" id="exampleFormControlTextarea2" rows="4"
                    placeholder="Describe your challenge and inspire others to join..."></textarea>
            </div>
            <div class="type">
                <label for="exampleFormControlSelect2" class="form-label">Type</label>
                <select class="form-control" id="exampleFormControlSelect2">
                    <option>Choose one…</option>
                    <option value="1">Running</option>
                    <option value="2">Lifting</option>
                    <option value="3">Meditating</option>
                </select>
            </div>
            <div class="metric">
                <label for="exampleFormControlSelect2" class="form-label">Metric</label>
                <select class="form-control" id="exampleFormControlSelect3">
                    <option>Choose one…</option>
                    <option value="1">Distance(Kilometer)</option>
                    <option value="2">Duration(minutes)</option>
                    <option value="3">Weight(kilograms)</option>
                </select>
            </div>
            <div class="goal">
                <label for="exampleFormControlInput2" class="form-label mb-2">Goal</label>
                <input type="text" class="form-control" id="exampleFormControlInput2" placeholder="Enter a target goal">
            </div>
            <div class="start">
                <label for="startDate">Start date</label>
                <input id="startDate" type="date" class="form-control" aria-label="Date picker"
                    placeholder="Select start date">
            </div>
            <div class="end">
                <label for="endDate">End date</label>
                <input id="endDate" type="date" class="form-control" aria-label="Date picker"
                    placeholder="Select end date">
            </div>
        </div>
        <div class="buttons">
            <input type="reset" value="Cancel" class="resetBtn">
            <input type="submit" value="Create challenge" class="submitBtn">
        </div>
    </form>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>

</html>
